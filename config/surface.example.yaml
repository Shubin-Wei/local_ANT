# local_ANT project configuration.
# Only the three paths below are needed.  Everything else is recognised from the data or derived from it by written
# rules when `lant run clean` runs (see <output_dir>/records/auto_parameters.json and docs/parameters.md):
# file formats and layout, station names, vertical component, sampling rate, processing-day boundary, array type
# (areal or line), frequency band, lag window, grid spacing, checkerboard sizes, sections.
#   lant validate -c my_project.yaml
#   lant run all -c my_project.yaml
# Relative paths are relative to this file.

project:
  output_dir: ./output              # all results, figures and records are written here

data:
  raw_dir: /path/to/raw_data        # any layout and file names; miniSEED, SAC, ... (detected per file)
  station_file: /path/to/stations.csv   # any common table form (CSV/TXT with or without header, Excel, StationXML)

# ---- optional: uncomment only what you need to change ---------------------------------------------------------
# project:
#   array_type: surface             # force areal (surface) or line instead of the automatic choice
# data:
#   exclude_stations: [YY.A07]      # stations judged unusable (instrument or coupling problems)
#   field_note_stations: [YY.B12]   # stations with a field note of having been moved or dug out
# correlation:
#   nproc: 4                        # days computed at the same time (memory per process ~ stations x 17 MB + pairs x 0.2 MB)
# reference:
#   source: file                    # borrow a reference curve instead of the F-J curve of this array
#   file: /path/to/other_output/05_reference/reference.npz
# inversion:
#   solver: pdsurftomo              # parallel solver (same result, more memory)
#   threads: 8
#   njobs: 2
# plots:
#   topography: "@earth_relief_01s" # relief under the maps (GMT remote grid, downloaded once) or a grid file
