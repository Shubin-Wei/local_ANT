# Lint, unit tests on the supported Python versions, a smoke test of the chain and an installed wheel, on every
# push and pull request.  The smoke test (tests/smoke_records.py) runs the chain from generated raw records up to the
# inversion project; its gates are confirmed automatically because the records are generated there - never do this
# with real data.  It checks that the chain runs, not accuracy (docs/validation.md).
name: tests
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.14.0"
      - name: lint
        run: ruff check lant tests tools
      - name: format
        run: ruff format --check lant tests tools

  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install
        run: |
          pip install -e ".[dev]"
          lant check || true  # GMT is not installed here; the tests that draw maps skip without it
      - name: unit tests
        run: python -m pytest tests -q --cov=lant --cov-report=term-missing --cov-report=xml
      - name: smoke test of the chain (to the inversion project)
        run: |
          python tests/smoke_records.py make --out /tmp/smoke
          python tests/smoke_records.py run --dir /tmp/smoke
          lant status -c /tmp/smoke/synthetic.yaml --json

  package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build distributions
        run: pip install "build>=1.2,<1.3" && python -m build
      - name: install the wheel outside the checkout
        run: |
          python -m venv /tmp/lant-installed
          /tmp/lant-installed/bin/pip install dist/*.whl
          cd /tmp
          /tmp/lant-installed/bin/lant --version
          /tmp/lant-installed/bin/lant init -o /tmp/installed.yaml
          /tmp/lant-installed/bin/python -c "import lant.inversion.dsurf_main"
