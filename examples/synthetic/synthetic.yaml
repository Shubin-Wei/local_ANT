# Configuration of the synthetic example (examples/synthetic/make_synthetic.py).
# Only the three paths are required; the velocity range is given to keep the example fast.  The other lines
# (a) lower thresholds meant for >= 50 stations, because this example has only 16 stations (120 pairs) and 3 days,
# and (b) make the inversion part fast enough for a first test (6 iterations, one checkerboard and one control).
project: {name: synthetic, output_dir: output}
data: {raw_dir: data, station_file: stations.txt, velocity_range_kms: [1.5, 3.5]}
dispersion: {njack: 3, nproc: 4}
export: {tmin_s: 0.2}
inversion: {median_min_pairs: 20, iterations: 6, threads: 4, njobs: 3}
checks: {checkerboards: [{name: cb, cell_km: [3.0, 3.0]}], vertical: [], controls: [start_grad0.05]}
