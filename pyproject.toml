[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lant"
version = "1.4.0"
description = "High-frequency ambient-noise surface-wave tomography for dense nodal arrays (raw data to 3-D Vs)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = ["numpy>=1.19", "scipy>=1.5", "h5py>=2.10", "obspy>=1.2", "matplotlib>=3.5", "pyyaml>=6.0", "openpyxl>=3.1"]

[project.scripts]
lant = "lant.cli:main"

[tool.setuptools]
packages = ["lant", "lant.inversion", "lant.plotting"]

[tool.setuptools.package-data]
lant = ["_external/*.sh", "_external/*.patch", "_external/*.f90"]
