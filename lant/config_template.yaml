# lant configuration.  This file is also the list of every setting and its default: a key that is not in it is an
# error.  `lant init` writes a copy with the numbers it suggests for your array (and how it got them).
# Paths may be absolute or relative to this file.  The basis of every default: docs/parameters.md.

output_dir: null              # REQUIRED: every result goes here, one folder per step (1_clean, 2_cc, ...)

data:
  raw_dir: null               # REQUIRED: continuous records, any format ObsPy reads, any folder layout
  station_file: null          # REQUIRED: table with a header line: network station longitude latitude [elevation]
                              #   (CSV or whitespace separated; the network column may be left out), or StationXML
  channel: "*Z"               # channel codes of the vertical component (shell pattern, e.g. "*Z", "DPZ", "*3")
  response: null              # StationXML / RESP / dataless SEED file or folder: the responses are removed
                              #   (pre-filter flat over cc.fmin_hz-cc.fmax_hz).  Leave null only when every
                              #   station has the same instrument model.
  start_date: null            # YYYY-MM-DD: first UTC day used (null: from the first record)
  end_date: null              # YYYY-MM-DD: last UTC day used (null: to the last record)
  exclude_stations: []        # NET.STA names left out
  velocity_range_kms: null    # REQUIRED: [slowest, fastest] Rayleigh phase velocity expected in the area (km/s).
                              #   Used for the suggested lag window and as the velocity axis of the measurement.

clean:                        # step 1: station-days cut, cleaned and decimated (lant clean)
  fs_hz: null                 # REQUIRED: sampling rate after decimation (Hz); a whole fraction of every raw rate

cc:                           # step 2: cross-correlation (lant cc)
  fmin_hz: null               # REQUIRED: lower edge of the correlation band (Hz)
  fmax_hz: null               # REQUIRED: upper edge (Hz); at most 0.4 x clean.fs_hz (anti-alias filter)
  maxlag_s: null              # REQUIRED: lags kept, -maxlag..+maxlag (s)
  segment_s: null             # REQUIRED: length of the segments that are correlated (s); at least 2 x maxlag_s
  overlap: 0.5                # overlap of consecutive segments (Welch averaging, Seats et al. 2012)
  max_over_std: 10.0          # a segment whose peak exceeds this x the std of its station-day is not used
                              #   (removes earthquakes and glitches; NoisePy, Jiang & Denolle 2020); 0: off
  substack_hours: 24          # length of the sub-stacks kept for the error estimate (24: one per day)
  max_distance_km: null       # correlate only pairs up to this distance (null: all pairs)

disp:                         # step 3: phase velocities (lant disp)
  fmin_hz: null               # measurement band (null: the correlation band)
  fmax_hz: null
  per_octave: 12              # measurement frequencies per octave
  reference: fj               # reference curve: fj (this array's F-J spectrum) | model (1-D Vs model) | file
  reference_file: null        # model: two columns depth_km Vs_km/s (nodes, linear in between);
                              #   file: two columns frequency_Hz phase_velocity_km/s
  fj_band_hz: null            # fj: [lo, hi] band where the F-J fundamental-mode ridge is picked (null: whole band)
  alpha: 5.0                  # Gaussian filter width: exp(-alpha ((f - fc) / fc)^2) (constant relative width)
  group_window: 0.3           # the group arrival is searched within +-30 % of the reference group velocity
  snr_min: 5.0                # signal-to-noise ratio of the arrival at least this
  min_wavelengths: 2.0        # path at least this many wavelengths (Bensen et al. 2007: 3; Luo et al. 2015: 1-2)
  max_jackknife_rel: 0.02     # jackknife standard deviation at most this fraction of c (null: not used); a pair
                              #   with fewer than 3 sub-stacks has no error estimate and is then rejected
  reference_error: 0.1        # largest relative error of the reference assumed where the cycle count is set: the
                              #   count is taken only where the path is at most 1 / (2 x this) wavelengths long
  slip_cycles: 0.3            # the phase is followed from frequency to frequency; a jump larger than this
                              #   fraction of a cycle ends the curve
  min_points: 6               # a curve needs at least this many consecutive frequencies

inv:                          # step 4: 3-D inversion (lant inv)
  data: phase                 # travel times inverted: phase | group | both (Rayleigh phase and/or group velocity)
  grid_km: null               # horizontal node spacing (null: median measured wavelength / 3)
  depths_km: null             # depth nodes, from 0 (null: rule from the average curve, see the log)
  start_model_file: null      # two columns depth_km Vs_km/s (null: 1-D inversion of the median curve)
  per_octave: 4               # periods per octave used in the inversion (a subset of the measured ones)
  iterations: 6               # iterations of the 3-D inversion
  weight: 0.5                 # smoothing weight (rms travel-time misfit in s per rms roughness in km/s)
  damping: 0.1                # damping towards the starting model (same units as weight)
  outlier_mad: 3.0            # travel times further than this x 1.4826 MAD from the median residual are not used
  vs_min_kms: null            # Vs bounds (null: 0.6 x the slowest and 1.4 x the fastest Vs of the start model)
  vs_max_kms: null

checker:                      # resolution test (lant checker --size KM)
  amplitude: 0.1              # +-10 % of the starting model
  noise: auto                 # auto: per period, the robust spread of the residuals of the 3-D model (s); or a
                              #   number (s)

plots:
  relief: auto                # auto: GMT remote relief (@earth_relief, needs internet; skipped if unavailable)
                              #   | a grid file | null: no relief
  vs_range_kms: null          # colour range of Vs [lo, hi] (null: 2-98 % of the model under the stations)
  slice_depths_km: null       # depths of the map slices (null: up to 8 depth nodes)
  dpi: 300

cores: auto                   # auto: 80 % of the idle cores; or a number
