# conda env create -f environment.yml && conda activate lant     (installs lant itself from this checkout)
# then: lant install-external && lant check
name: lant
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy
  - scipy
  - h5py
  - obspy
  - matplotlib
  - pyyaml
  - openpyxl          # Excel station tables
  - gmt>=6.1          # maps and sections
  - ghostscript
  - cython
  - compilers         # gfortran, gcc, g++ for DSurfTomo, pDSurfTomo
  - make
  - git
  - pytest
  - pip
  - pip:
      - -e .
