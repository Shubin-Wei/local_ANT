# The environment of lant (Linux): conda env create -f environment.yml && conda activate lant
# It installs lant itself from this checkout (pip -e .); then: lant check
name: lant
channels:
  - conda-forge
dependencies:
  - python>=3.11
  - numpy>=1.26
  - scipy
  - numba
  - h5py
  - obspy
  - matplotlib
  - pyyaml
  - gmt>=6.1          # maps (optional: without it the maps are not drawn)
  - ghostscript
  - pytest
  - pip
  - pip:
      - -e .
