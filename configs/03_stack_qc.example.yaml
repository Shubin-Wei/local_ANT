# Configuration for scripts/03_stack_qc.py
# Paths are relative to this YAML file's directory.
# CLI flags override values set here.

# --- Paths ---
stack-dir: ../TestData/StackData
outdir: ../TestData/figures

# --- Filter ---
freqmin: 1
freqmax: 5
component: ZZ
stack-method: all

# --- Station filter ---
# Single station or comma-separated list:
#   station: CF.17982
#   station: "17982,58808"
# Or a list:
#   station:
#     - CF.17982
#     - CF.58808

# --- Distance filter ---
# min-dist: 0.0
# max-dist: 50.0
# max-records: 100

# --- Time window ---
maxlag: 10

# --- Plot style ---
style: both
output-format: png
dpi: 200
overwrite: true

# --- Plot appearance ---
# cmap: RdBu_r
# clip-percentile: 99.0
# figure-width: 10.5
# min-figure-height: 5.4
# max-figure-height: 9.0
# max-distance-ticks: 8
# max-time-ticks: 5
wiggle-scale: 50
wiggle-every: 100
# no-title: false

# --- Other ---
# allow-missing-distance: false
# validate-only: false
# log-level: INFO
