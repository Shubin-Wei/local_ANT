# =====================================================================
# 05_dispersion — dispersion analysis & curve picking
#   entry: python scripts/05_dispersion.py --config configs/05_dispersion.yaml
#   env:   conda activate egfanalysispy   (Python 3.6 + TensorFlow 1.13)
#
# This is the single user-facing config for step 05. The entry script
# renders it into the runtime config module EGFAnalysisPy expects
# (written into the result directory) and invokes run.py /
# run_parallel.py; the bundled EGFAnalysisPy/config.py stays untouched.
#
# Meanings and defaults follow EGFAnalysisPy/config.py.
# =====================================================================

paths:
  # CF/EGF input dir from step 04 (down to component level,
  # e.g. .../Allstack_robust/ZZ)
  waveform_path: /path/to/egfanalysis_input/Allstack_robust/ZZ
  # Result output directory
  result_path:   /path/to/DisperPicker_result

run:
  parallel: false        # true = use run_parallel.py (multiprocessing)
  workers: 4             # worker count (only when parallel: true)

signal:
  isEGF: false           # input is EGF (true) or CF (false)
  GreenFcnObjects: A_add_B   # A_add_B | A | B (lag-branch handling)
  WinAlpha: 0.1          # Tukey window alpha
  NoiseTime: 60          # noise window length (s)
  MinSNR: 2.0            # minimum signal-to-noise ratio
  WinPeriodNum: 5        # periods per group-velocity window
  WinMinTime: 0.2        # minimum window length (s)
  FilterKaiserPara: 6    # FIR Kaiser parameter
  MaxFilterLengthLog: 14 # max filter length (log2)

dispersion:
  StartV: 0.5            # velocity range min (km/s)
  EndV: 3.5              # velocity range max (km/s)
  StartT: 0.4            # period range min (s)
  EndT: 3.0              # period range max (s)
  DeltaT: 0.02           # period step (s)
  DeltaV: 0.005          # velocity step (km/s); DisperPicker requires 0.005
  MinStaDist: 0.5        # minimum station distance (km)
  # Minimum wavelength-to-distance ratio used by picking QC
  # (formerly hard-coded in run.py; tune per dataset)
  MinWavelengthRatio: 2.0

picker:
  # DisperPicker picking thresholds (tune per dataset; generic defaults)
  confidence_G: 0.4
  mean_confidence_C: 0.25
  confidence_C: 0
  # Fraction of files that get a QC figure (0-1; 1 = all, slow)
  random_plot_ratio: 0.02
  # Reference-period overrides (advanced; usually null / [])
  ref_T: null
  ref_T2: []
