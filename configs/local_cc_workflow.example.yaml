# Configuration for local_cc_workflow.py
# Paths are relative to this YAML file's directory.
# CLI flags override values set here.

# --- Paths ---
data-dir: /data/Shenxz/Weishb/HJ/SurfaceData
station-csv: /data/Shenxz/Weishb/HJ/SurfaceData/station.csv
ccf-dir: /data/Shenxz/Weishb/HJ/SurfaceCCFData
stack-dir: /data/Shenxz/Weishb/HJ/SurfaceStackData

# --- Stage control ---
# stage: all                  # cc, stack, or all
# overwrite: true            # remove existing output dirs before running

# --- Processing ---
freqmin: 0.3
freqmax: 10
sampling-rate: 25.0
maxlag: 500
inc-hours: 24
cc-len: 1800
step: 900.0
max-over-std: 10
smoothspect-n: 20
smooth-n: 10

# --- Normalization ---
time-norm: rma
freq-norm: rma
rm-resp: "no"

# --- Substack ---
substack: true
substack-windows: 1
keep-substack: false

# --- Stacking ---
stack-method: all

# --- Station filter ---
station-pattern: "*"

# --- Components ---
ncomp: 1
rotation: false
xcorr-only: true
acorr-only: false

# --- Logging ---
# log-level: INFO
