# =====================================================================
# 04_export_egf — export EGFAnalysisPy input
#   entry: python scripts/04_export_egf.py --config configs/04_export_egf.yaml
#   env:   conda activate noisepy
#
# Keys mirror the CLI options of scripts/04_export_egf.py one-to-one;
# explicit CLI options override values given here.
# =====================================================================

# Stack directory produced by step 02
stack-dir: ../TestData/StackData

# Stack method to export: linear | pws | robust | all,
# or a full dataset name such as Allstack_robust
stack-method: all

# Component to export
component: ZZ

# Only export pairs involving this station; null = all pairs
station: null

# Output root (parent of the step-05 waveform_path)
output-root: ../TestData/egfanalysis_input
