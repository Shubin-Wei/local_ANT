# =====================================================================
# 00_project — project-wide shared settings
#
# Purpose: paths referenced by several steps, so stage configs stay
# small and nothing is repeated.
#
# Consumed by:
#   scripts/05_dispersion.py          (egfanalysispy_dir)
#   scripts/06b_area_inversion/*.py   (dsurftomo_bin, dsurftomo_dir)
# Steps 01-04 read only their own stage configs, not this file.
# Stage-config paths always take precedence over values defined here.
#
# Precedence:  CLI args > stage config > this file > code defaults
# =====================================================================

# Project name (used in logs and figure titles only)
project_name: my_ant_project

# Root directories for data and results (placeholders — edit them)
data_root:   /path/to/project/data        # raw & cleaned waveforms
work_root:   /path/to/project/work        # per-step outputs

# Station coordinate CSV (same format as the step-02 station-csv)
station_csv: /path/to/project/data/station.csv

# EGFAnalysisPy directory (default: bundled subdirectory; rarely changed)
egfanalysispy_dir: EGFAnalysisPy

# DSurfTomo directory and compiled executable (see docs/INSTALL.md §4)
dsurftomo_dir: DSurfTomo
dsurftomo_bin: DSurfTomo/bin/DSurfTomo
