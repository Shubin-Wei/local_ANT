# =====================================================================
# 01_clean — miniSEED cleaning for NoisePy
#   entry: python scripts/01_clean.py --config configs/01_clean.yaml
#   env:   conda activate noisepy
#
# Keys mirror the CLI options of scripts/01_clean.py one-to-one;
# explicit CLI options override values given here.
# =====================================================================

# Raw miniSEED root (one subdirectory per station)
input-root: ../TestData/RawData

# Cleaned output root
output-root: ../TestData/CleanData

# Minimum per-day completeness (0-1); days below are dropped
min-completeness: 0.8

# Channel code to keep; null = auto (Z component)
target-channel: null

# Date range [start, end], format YYMMDD, both ends exclusive; null = everything
date-range: null

# Overwrite existing outputs (default false, to avoid silent overwrites)
overwrite: false
