# Configuration for scripts/02_correlation.py
# Paths are relative to this YAML file's directory.
# CLI flags override values set here.

# --- Paths ---
data-dir: ../TestData/CleanData       # output of step 01
station-csv: ../TestData/station.csv  # station file (see workflow step 01)
ccf-dir: ../TestData/CCFData          # cross-correlation output
stack-dir: ../TestData/StackData      # stacking output

# --- Stage control ---
# stage: all                  # cc, stack, or all
# overwrite: true            # remove existing output dirs before running

# --- Processing ---
freqmin: 0.2
freqmax: 10
sampling-rate: 25.0
maxlag: 100
inc-hours: 24
cc-len: 600
step: 300.0
max-over-std: 10
smoothspect-n: 20
smooth-n: 30

# --- Normalization ---
time-norm: rma
freq-norm: rma
rm-resp: "no"

# --- Substack ---
substack: true
substack-windows: 1
keep-substack: false

# --- Stacking ---
stack-method: all

# --- Station filter ---
station-pattern: "*"

# --- Components ---
ncomp: 1
rotation: false
xcorr-only: true
acorr-only: false

# --- Logging ---
# log-level: INFO
