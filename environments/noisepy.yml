# NoisePy environment: steps 01-04 and the 06b entry scripts.
# Official NoisePy install guide: https://github.com/noisepy/NoisePy
#
# create : conda env create -f environments/noisepy.yml
# enable : conda activate noisepy
#
# noisepy-seis transitively installs everything else these steps need
# (obspy via pyasdf, numpy, scipy, pandas, matplotlib via obspy, h5py,
# pyyaml, datetimerange, tqdm) — verified on the original project
# machine (Python 3.10.20, noisepy-seis 0.9.93, obspy 1.5.0,
# numpy 1.26.4, scipy 1.12.0, pandas 1.5.3, matplotlib 3.10.9,
# h5py 3.16.0, PyYAML 6.0, DateTimeRange 2.3.2, tqdm 4.68.2).
name: noisepy
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - noisepy-seis
